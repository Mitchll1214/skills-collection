<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <title>Skills Collection · AI Skill 收藏清单</title>
  <link rel="stylesheet" href="style.css">
  <link rel="alternate" type="application/rss+xml" title="Skills Collection RSS" href="feed.xml">
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <h1>🧰 Skills Collection</h1>
      <p class="subtitle">个人收藏的 AI Skill 清单 — 由 config.json 自动同步生成</p>
      <div class="subscribe">
        <a class="rss-btn" href="feed.xml" target="_blank" rel="noopener">📡 订阅 RSS</a>
        <a class="gh-btn" href="https://github.com/Mitchll1214/skills-collection" target="_blank" rel="noopener">GitHub ↗</a>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="toolbar">
      <input id="search" type="search" class="search" placeholder="🔍 搜索名称 / 描述 / 标签…" autocomplete="off">
      <span id="count" class="count"></span>
    </div>
    <div id="tag-filters" class="tag-filters"></div>

    <div id="banner" class="banner" hidden></div>
    <div id="grid" class="grid"></div>
    <div id="empty" class="empty" hidden>
      <p>😕 没有匹配的 Skill</p>
    </div>
  </main>

  <footer class="footer">
    <p>数据来源: <code>public/skills.json</code> · 由 <code>scripts/sync.py</code> 自动生成</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
