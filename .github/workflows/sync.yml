name: sync

on:
  # 任何提交到 main 的代码/config 变更都会触发同步
  push:
    branches: [main]
  schedule:
    # 每日凌晨 3 点(UTC)定时同步
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行同步脚本
        run: python scripts/sync.py

      - name: 提交并推送变更
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "skills-collection bot"
          git config user.email "actions@github.com"
          git add public/ skills/ translation_cache.json config.json
          if git diff --cached --quiet; then
            echo "无变更,跳过提交"
          else
            # [skip ci] 让自动提交不触发新一轮构建,避免循环
            git commit -m "chore: sync skills (auto) [skip ci]"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          fi

      # 显式触发 Cloudflare Pages 部署(可选):
      # 在仓库 Settings -> Secrets 添加 CF_DEPLOY_HOOK(Pages 项目创建的 Deploy Hook URL)后生效;
      # 未配置时跳过,仍由「main 更新触发 Pages 自动部署」兜底。
      - name: 触发 Cloudflare Pages 部署(可选)
        if: ${{ env.CF_DEPLOY_HOOK != '' }}
        env:
          CF_DEPLOY_HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: curl -sf -X POST "$CF_DEPLOY_HOOK"
